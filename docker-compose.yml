services:
  postgres:
    image: postgres:16-alpine
    container_name: nhms_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nepal_hemophilia}
      POSTGRES_USER: ${POSTGRES_USER:-hemophilia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hemophilia_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hemophilia_user} -d ${POSTGRES_DB:-nepal_hemophilia}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
