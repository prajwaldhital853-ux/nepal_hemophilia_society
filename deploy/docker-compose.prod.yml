# NHMS production stack for a single VPS.
# Usage (from repo root):
#   cp deploy/.env.vps.example deploy/.env
#   # edit deploy/.env — domains, secrets, passwords
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nhms]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PORT: 8000
    volumes:
      - media_data:/app/media
      - backup_data:/app/private_backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [nhms]

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      PORT: 3000
    depends_on: [api]
    networks: [nhms]

  website:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.website
    restart: unless-stopped
    environment:
      PORT: 3001
      HOST: 0.0.0.0
    networks: [nhms]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      WWW_HOST: ${WWW_HOST}
      APEX_HOST: ${APEX_HOST}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - media_data:/var/www/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on: [api, admin, website]
    networks: [nhms]

volumes:
  postgres_data:
  media_data:
  backup_data:
  certbot_www:
  certbot_certs:

networks:
  nhms:
    driver: bridge
